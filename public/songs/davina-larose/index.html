  <script>
    /* =========================================================
   AUDIO PLAYERS
========================================================= */

function setupAudioPlayers() {

    // Setup end behavior
    document.querySelectorAll(".audio-entry audio").forEach(audio => {

        audio.addEventListener("ended", () => {

            // Return to beginning
            audio.currentTime = 0;

            // Pause
            audio.pause();

            // Restore play icon
            const button = audio
                .closest(".audio-entry")
                .querySelector(".audio-button");

            button.textContent = "▶";
        });

    });

    // Handle play/pause clicks
    document.addEventListener("click", function (e) {

        if (!e.target.classList.contains("audio-button")) return;

        const entry = e.target.closest(".audio-entry");

        const audio = entry.querySelector("audio");

        if (audio.paused) {

            // Pause all other players
            document.querySelectorAll(".audio-entry audio").forEach(a => {

                if (a !== audio) {

                    a.pause();
                    a.currentTime = 0;

                    const otherButton = a
                        .closest(".audio-entry")
                        .querySelector(".audio-button");

                    otherButton.textContent = "▶";
                }

            });

            // Play current audio
            audio.play();

            e.target.textContent = "❚❚";

        } else {

            audio.pause();

            e.target.textContent = "▶";
        }

    });

}
    setupAudioPlayers();

  </script>
